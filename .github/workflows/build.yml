name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # 首次生成固定签名密钥需要提交回仓库

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web deps
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Copy web bundle into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/. android/app/src/main/assets/
          echo "assets files: $(find android/app/src/main/assets -type f | wc -l)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure fixed signing keystore
        working-directory: android
        shell: bash
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            echo "Generating fixed signing keystore (first run)"
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DaFeiYu,O=Personal,C=DE"
          else
            echo "Fixed keystore already present"
          fi

      - name: Setup Android SDK components
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" || true

      - name: Commit fixed keystore (first run only)
        if: always()
        shell: bash
        run: |
          if [ -f android/keystore/debug.keystore ] && \
             ! git ls-files --error-unmatch android/keystore/debug.keystore >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/keystore/debug.keystore
            git commit -m "chore(android): add fixed signing keystore for in-place updates"
            git push
          else
            echo "Keystore already tracked"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
